server {
    listen 80;
    server_name 159.223.139.4;

    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60;
    }
    location /webhook {
        proxy_pass         http://127.0.0.1:8000/webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
    location /vezot-orders {
        alias /var/www/vezot/server/static/dashboard.html;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, no-transform";
    }
    location /submit-order {
        proxy_pass         http://127.0.0.1:8000/submit-order;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
    location /order-form/ {
        proxy_pass         http://127.0.0.1:8000/order-form/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
    location /static/ {
        proxy_pass         http://127.0.0.1:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
    root  /var/www/vezot/dashboard/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name vezot-fuel.com;

    ssl_certificate     /etc/letsencrypt/live/vezot-fuel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vezot-fuel.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
