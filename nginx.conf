server {
    listen 80;
    server_name 159.223.139.4;

    # Python FastAPI — כל ה-routes של השרת
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60;
    }

    location /webhook {
        proxy_pass         http://127.0.0.1:8000/webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /dashboard {
        proxy_pass         http://127.0.0.1:8000/dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Cache-Control "no-cache, no-store";
    }

    location /submit-order {
        proxy_pass         http://127.0.0.1:8000/submit-order;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /order-form/ {
        proxy_pass         http://127.0.0.1:8000/order-form/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /static/ {
        proxy_pass         http://127.0.0.1:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # React App
    root  /var/www/vezot/dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
